name: Deploy Document QA API

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy through Systems Manager
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-013cd277c4fabe6f1 \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["cd /home/ubuntu/document-qa-api && git pull origin main && sudo docker compose up -d --build"]' \
            --query "Command.CommandId" \
            --output text)

          echo "Deployment command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id i-013cd277c4fabe6f1

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-013cd277c4fabe6f1 \
            --query "StandardOutputContent" \
            --output text